server:
  port: 5000

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: Job Portal API Gateway
    description: API Gateway for Job Portal microservices
    version: 0.0.1-SNAPSHOT
    java: 21
